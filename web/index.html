<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业情报调研分析系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" v-cloak>
  <!-- 侧栏：发起调研 + 历史任务 -->
  <aside class="sidebar">
    <div class="brand">
      <h1>企业情报调研</h1>
      <p>多 Agent 调研工作台</p>
    </div>

    <form class="panel new-task" @submit.prevent="submitTask">
      <label>公司名称
        <input v-model.trim="form.company" placeholder="例如：小米" required>
      </label>
      <label>调研目标
        <textarea v-model.trim="form.objective" rows="3"
                  placeholder="例如：评估与其合作的供应链风险"></textarea>
      </label>
      <div class="mode-row">
        <button type="button" class="mode-chip" :class="{active: form.mode==='standard'}"
                @click="form.mode='standard'">分层团队</button>
        <button type="button" class="mode-chip" :class="{active: form.mode==='deep'}"
                @click="form.mode='deep'">深度研究</button>
      </div>
      <label class="check-row">
        <input type="checkbox" v-model="form.autoApprove"> 自动通过人工审批
      </label>
      <button type="submit" class="btn primary" :disabled="submitting">
        {{ submitting ? '提交中…' : '开始调研' }}
      </button>
      <p v-if="formError" class="form-error">{{ formError }}</p>
    </form>

    <h2 class="side-title">历史任务<span class="side-count" v-if="tasks.length">{{ tasks.length }}</span></h2>
    <ul class="task-list">
      <li v-if="!tasks.length" class="empty">暂无历史任务</li>
      <li v-for="t in tasks" :key="t.id">
        <div class="task-item" role="button" tabindex="0"
             :class="{active: current && current.id===t.id}"
             @click="selectTask(t)" @keydown.enter="selectTask(t)">
          <div class="task-row">
            <span class="task-company">{{ t.company }}</span>
            <button class="task-del" title="删除任务" @click.stop="delTask(t)">✕</button>
          </div>
          <span class="task-meta">
            <span>{{ t.mode === 'deep' ? '深度研究' : '分层团队' }}</span>
            <span class="task-time" :title="t.created_at">{{ (t.created_at || '').slice(5, 16) }}</span>
          </span>
          <status-pill :status="t.status"></status-pill>
        </div>
      </li>
    </ul>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <template v-if="!current">
      <div class="hero">
        <h2>发起一次调研，或在左侧选择历史任务</h2>
        <div class="mode-cards">
          <div class="mode-card m-standard">
            <b>分层团队</b>
            <span>搜集组先摸清信息，分析组与风控组并行研判，最后汇成综合报告。</span>
          </div>
          <div class="mode-card m-deep">
            <b>深度研究</b>
            <span>先拆解子问题，多个研究员并行取证，质检员循环把关直到覆盖完整。</span>
          </div>
        </div>
        <p class="hero-note">报告生成后会暂停等你审批；每次调研的情报自动存入知识库，下次可直接检索复用。</p>
      </div>
    </template>

    <template v-else>
      <header class="task-header">
        <div>
          <h2>{{ current.company }}
            <span class="mode-tag">{{ current.mode === 'deep' ? '深度研究' : '分层团队' }}</span>
          </h2>
          <p class="objective">{{ current.objective || '全面调研' }}</p>
        </div>
        <div class="header-actions">
          <button v-if="current.status==='failed'" class="btn ghost"
                  @click="retryTask(current)">↻ 从断点重试</button>
          <status-pill :status="current.status" large></status-pill>
        </div>
      </header>

      <!-- 审批面板（awaiting_approval 时优先展示） -->
      <approval-panel v-if="current.status==='awaiting_approval'"
                      :task-id="current.id" @decided="onDecided"></approval-panel>

      <nav class="tabs" v-else>
        <button v-for="tab in tabs" :key="tab.key" class="tab"
                :class="{active: activeTab===tab.key}" @click="activeTab=tab.key">
          {{ tab.label }}
        </button>
      </nav>

      <!-- keep-alive 缓存 tab 面板：切换 tab 不销毁重建，避免报告内容闪烁与重复请求 -->
      <keep-alive>
        <timeline-panel v-if="activeTab==='timeline' && current.status!=='awaiting_approval'"
                        :events="events" :polling="polling"></timeline-panel>
        <report-panel v-else-if="activeTab==='report' && current.status!=='awaiting_approval'"
                      :task-id="current.id" :refresh-key="resultVersion"></report-panel>
        <kb-panel v-else-if="activeTab==='kb'"></kb-panel>
      </keep-alive>
    </template>
  </main>
</div>

<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
